media:
  input: assets/banners
  output: assets/banners
  extensions:
    - jpg
    - jpeg
    - png
    - webp
    - gif
  rename: safe

content:
  - name: programs
    label: Programs
    type: collection
    path: content/programs
    extension: json
    format: json
    filename: "{fields.id}"
    view:
      fields:
        - title
        - cat
        - status
        - visible
        - order
      primary: title
      sort:
        - order
        - title
    fields:
      - name: id
        label: "LOCKED: Program ID - do not edit"
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Use lowercase letters, numbers, and hyphens only."
        description: "DO NOT CHANGE. This is the permanent website key. Change the Program Name field instead."

      - name: title
        label: Program Name
        type: string
        required: true

      - name: cat
        label: Category
        type: select
        required: true
        options:
          values:
            - Foundations
            - Pathway
            - Camp
            - Pro Development
            - Small-Sided
            - Ball Mastery
            - Technical
            - Dribbling
            - Finishing
            - Goalkeeping

      - name: age
        label: Age Range
        type: string
        required: true

      - name: banner
        label: Banner Image
        type: image

      - name: desc
        label: Short Description
        type: text
        required: true

      - name: meta
        label: Card Details
        type: string
        list: true
        description: "Examples: 6 Weeks, Friday Nights, 8:00 AM - 3:30 PM"

      - name: status
        label: Registration Status
        type: select
        required: true
        options:
          values:
            - name: open
              label: Open
            - name: waitlist
              label: Waitlist
            - name: coming-soon
              label: Coming Soon

      - name: visible
        label: Show on Website
        type: boolean

      - name: featured
        label: Featured Program
        type: boolean

      - name: order
        label: Display Order
        type: number

      - name: details
        label: Lightbox Details
        type: object
        fields:
          - name: kicker
            label: Kicker / Category Override
            type: string

          - name: title
            label: Detail Title Override
            type: string

          - name: tagline
            label: Tagline
            type: string

          - name: bannerPlaceholder
            label: Banner Placeholder
            type: string

          - name: facts
            label: Quick Facts
            type: object
            list: true
            fields:
              - name: label
                label: Label
                type: string
              - name: value
                label: Value
                type: string

          - name: body
            label: Detail Copy
            type: text
            description: "Markdown supported. Use ## headings and - bullet lists."

