<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Springfield Soccer Center — Mobile Preview</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(120% 80% at 50% -10%, #12243a 0%, transparent 55%),
      #070c14;
    font-family: -apple-system, "Plus Jakarta Sans", system-ui, sans-serif;
    color: #cdd6e3;
    overflow: hidden;
  }
  .stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px;
  }
  .caption {
    text-align: center;
    user-select: none;
  }
  .caption .eyebrow {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #5d6e84; font-weight: 700; margin: 0 0 6px;
  }
  .caption .label {
    font-size: 15px; font-weight: 600; color: #e8edf4; margin: 0;
  }
  .caption .label span { color: #5d6e84; font-weight: 500; }
  .phone-scaler { transform-origin: center center; }
  .hint {
    position: fixed; bottom: 18px; left: 0; right: 0; text-align: center;
    font-size: 12px; color: #4a596e; letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="frames/ios-frame.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;
const DEVICE_W = 402, DEVICE_H = 874, SAFE_TOP = 56;

function MobilePreview() {
  const [scale, setScale] = useState(1);
  useEffect(() => {
    const fit = () => {
      const padX = 40, padY = 120; // leave room for caption + hint
      const s = Math.min(
        1,
        (window.innerWidth - padX * 2) / DEVICE_W,
        (window.innerHeight - padY) / DEVICE_H
      );
      setScale(Math.max(0.4, s));
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  return (
    <div className="stage">
      <div className="caption">
        <p className="eyebrow">Mobile Preview</p>
        <p className="label">Springfield Soccer Center <span>· iPhone · live &amp; scrollable</span></p>
      </div>
      <div className="phone-scaler" style={{ transform: `scale(${scale})`, width: DEVICE_W, height: DEVICE_H }}>
        <IOSDevice dark>
          <div style={{ position: 'absolute', top: SAFE_TOP, left: 0, right: 0, bottom: 0, background: '#0a1422' }}>
            <iframe
              src="index.html"
              title="Springfield Soccer Center mobile view"
              onLoad={(e) => {
                // Intro/scroll-reveal animations stall on their hidden first frame
                // inside a non-active iframe. The site exposes a `nomotion` body
                // class that forces every reveal to its final visible state.
                try { e.target.contentDocument.body.classList.add('nomotion'); } catch (_) {}
              }}
              style={{ width: '100%', height: '100%', border: 0, display: 'block', background: '#0a1422' }}
            />
          </div>
        </IOSDevice>
      </div>
      <div className="hint">Scroll inside the phone to explore · this is your real site at mobile width</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MobilePreview />);
</script>
</body>
</html>
