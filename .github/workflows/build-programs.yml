name: Build Program Catalog

on:
  push:
    paths:
      - "content/programs/**"
      - "scripts/build-programs.ps1"
      - "scripts/generate-programs-seo.js"
      - ".github/workflows/build-programs.yml"

permissions:
  contents: write

jobs:
  build-programs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build content/programs.json
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $InputDir = "content/programs"
          $OutputFile = "content/programs.json"

          if (!(Test-Path $InputDir)) {
            throw "Missing folder: $InputDir"
          }

          $programs = Get-ChildItem "$InputDir/*.json" |
            ForEach-Object {
              Write-Host "Reading $($_.Name)"
              Get-Content $_.FullName -Raw | ConvertFrom-Json
            } |
            Sort-Object order

          if ($programs.Count -eq 0) {
            throw "No program JSON files found in $InputDir"
          }

          @{
            programs = @($programs)
          } | ConvertTo-Json -Depth 20 | Set-Content $OutputFile -Encoding UTF8

          Write-Host "Built $OutputFile with $($programs.Count) programs."

      - name: Inject crawlable SEO section into index.html
        run: node scripts/generate-programs-seo.js

      - name: Commit rebuilt catalog and SEO section
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add content/programs.json index.html

          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "Auto-build program catalog and SEO section [skip ci]"
            git push
          fi
