name: Rebuild programs.json

on:
  push:
    paths:
      - "content/programs/*.json"
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild programs.json
        run: node scripts/build-programs.mjs

      - name: Commit rebuilt file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/programs.json
          git diff --cached --quiet || git commit -m "chore: rebuild programs.json [skip ci]"
          git push
